services:

  backend:
    build:
      context: ./apps/backend
    volumes:
      - db_data:/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/barter.db
      SEMANTIC_URL: http://semantic_analysis:8002
      AUDIO_URL: http://audio_pipeline:8001
      WARNING_URL: http://warning_engine:8003
      RESOURCE_URL: http://resource_agent:8004
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    restart: on-failure
    depends_on:
      - semantic_analysis
      - warning_engine
      - resource_agent

  audio_pipeline:
    build:
      context: ./apps/audio_pipeline
    volumes:
      - model_cache:/root/.cache
    environment:
      BACKEND_URL: http://backend:8000
      SEMANTIC_URL: http://semantic_analysis:8002
      WARNING_ENGINE_URL: http://warning_engine:8003
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-core-barter-audio-tmp}
      STT_BACKEND: ${STT_BACKEND:-aws}
    restart: on-failure

  semantic_analysis:
    build:
      context: ./apps/semantic_analysis
    volumes:
      - model_cache:/root/.cache
    environment:
      WARNING_ENGINE_URL: http://warning_engine:8003
      BACKEND_URL: http://backend:8000
    restart: on-failure

  warning_engine:
    build:
      context: ./apps/warning_engine
    environment:
      BACKEND_URL: http://backend:8000
    restart: on-failure

  resource_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resource
      POSTGRES_PASSWORD: resource
      POSTGRES_DB: resource
    ports:
      - "5433:5432"
    volumes:
      - resource_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  resource_agent:
    build:
      context: ./apps/resource_agent
    environment:
      DATABASE_URL: postgresql+asyncpg://resource:resource@resource_db:5432/resource
    depends_on:
      resource_db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: on-failure

volumes:
  db_data:
  model_cache:
  resource_db_data: