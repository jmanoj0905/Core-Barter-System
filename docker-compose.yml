services:

  backend:
    build:
      context: ./apps/backend
    volumes:
      - db_data:/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/barter.db
      SEMANTIC_URL: http://semantic_analysis:8002
      AUDIO_URL: http://audio_pipeline:8001
      WARNING_URL: http://warning_engine:8003
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    restart: on-failure
    depends_on:
      - semantic_analysis
      - warning_engine

  audio_pipeline:
    build:
      context: ./apps/audio_pipeline
    volumes:
      - model_cache:/root/.cache
    environment:
      BACKEND_URL: http://backend:8000
      SEMANTIC_URL: http://semantic_analysis:8002
      WARNING_ENGINE_URL: http://warning_engine:8003
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-core-barter-audio-tmp}
      STT_BACKEND: ${STT_BACKEND:-aws}
    restart: on-failure

  video_engagement:
    build:
      context: ./apps/video_engagement
    volumes:
      - model_cache:/root/.cache
    environment:
      BACKEND_URL: http://backend:8000
      WARNING_ENGINE_URL: http://warning_engine:8003
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      VIDEO_BACKEND: ${VIDEO_BACKEND:-local}
      VIDEO_WEIGHT_EYES: ${VIDEO_WEIGHT_EYES:-0.55}
      VIDEO_WEIGHT_HEAD: ${VIDEO_WEIGHT_HEAD:-0.4}
      VIDEO_WEIGHT_GAZE: ${VIDEO_WEIGHT_GAZE:-0.05}
    restart: on-failure

  semantic_analysis:
    build:
      context: ./apps/semantic_analysis
    volumes:
      - model_cache:/root/.cache
    environment:
      WARNING_ENGINE_URL: http://warning_engine:8003
      BACKEND_URL: http://backend:8000
    restart: on-failure

  warning_engine:
    build:
      context: ./apps/warning_engine
    environment:
      BACKEND_URL: http://backend:8000
      FUSION_WEIGHT_SPEECH: ${FUSION_WEIGHT_SPEECH:-3.4486188047224937}
      FUSION_WEIGHT_VIDEO: ${FUSION_WEIGHT_VIDEO:-3.9024996131627105}
      FUSION_BIAS: ${FUSION_BIAS:--2.4287558170454084}
    restart: on-failure

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: on-failure

volumes:
  db_data:
  model_cache: